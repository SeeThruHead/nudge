[package]
name = "nudge"
version = "0.6.1"
edition = "2024"
description = "Schedules prompts to coding agents in Herdr, tmux, cmux, Orca or Claude Code, and tells them to back off when the machine is overloaded"
license = "MIT"
repository = "https://github.com/SeeThruHead/nudge"
readme = "README.md"
keywords = ["agents", "scheduler", "claude", "tmux", "cron"]
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
croner = "2"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
toml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
