[package]
name = "nudge"
version = "0.1.0"
edition = "2024"
description = "Prompts Herdr-hosted coding agents on a schedule"
publish = false

[dependencies]
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
