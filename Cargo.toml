[package]
name = "nudge"
version = "0.9.1"
edition = "2024"
description = "Sends messages to coding agents in Herdr, on a schedule or on demand"
license = "MIT"
repository = "https://github.com/SeeThruHead/nudge"
readme = "README.md"
keywords = ["agents", "scheduler", "herdr", "cron"]
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
croner = "2"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
